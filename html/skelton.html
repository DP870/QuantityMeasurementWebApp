<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantity Measurement</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styling.css">
</head>
<body>
    <header class="app-header">
        <h1 class="main-title font-inter">Quantity Measurement</h1>
    </header>

    <div class="main-wrapper">
        <div class="category-section">
            <span class="label-text font-inter">CHOOSE TYPE</span>
            <div class="grid-layout">
                <div class="unit-box">
                    <div class="icon-wrapper"><div>📏</div></div>
                    <div class="label-text font-inter box-label">Length</div>
                </div>
                <div class="unit-box">
                    <div class="icon-wrapper"><div>⚖️</div></div>
                    <div class="label-text font-inter box-label">Weight</div>
                </div>
                <div class="unit-box">
                    <div class="icon-wrapper"><div>🌡️</div></div>
                    <div class="label-text font-inter box-label">Temperature</div>
                </div>
                <div class="unit-box">
                    <div class="icon-wrapper"><div>🫙</div></div>
                    <div class="label-text font-inter box-label">Volume</div>
                </div>
            </div>
        </div>

        <div class="mode-section">
            <span class="label-text font-inter">CHOOSE ACTION</span>
            <div class="button-group">
                <button class="mode-btn">Comparison</button>
                <button class="mode-btn">Conversion</button>
                <button class="mode-btn">Arithmetic</button>
            </div>
            
            <div class="converter-panel">
                <div class="panel-header">
                    <span class="label-text font-inter">FROM</span>
                    <span class="label-text font-inter">TO</span>
                </div>
                <div class="panel-body">
                    <div class="input-block">
                        <input class="value-input font-inter" type="number" placeholder="0">
                        <div class="select-wrapper">
                            <select class="unit-select font-inter">
                                <option value="meter">Meter</option>
                                <option value="kilometer">Kilometer</option>
                                <option value="centimeter">Centimeter</option>
                                <option value="millimeter">Millimeter</option>
                            </select>
                        </div>
                    </div>
                    <div class="input-block">
                        <input class="value-input font-inter" type="number" placeholder="0" readonly>
                        <div class="select-wrapper">
                            <select class="unit-select font-inter">
                                <option value="meter">Meter</option>
                                <option value="kilometer">Kilometer</option>
                                <option value="centimeter">Centimeter</option>
                                <option value="millimeter">Millimeter</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
