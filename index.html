<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantity Measurement</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/styling.css">
</head>

<body>

    <header class="app-header">
        <h1 class="main-title font-inter">Quantity Measurement</h1>
    </header>

    <div class="main-wrapper">

        <div class="category-section">
            <span class="label-text font-inter">CHOOSE TYPE</span>
            <div class="grid-layout">
                <div class="unit-box" data-type="length">
                    <div class="icon-wrapper"><div>📏</div></div>
                    <div class="label-text font-inter box-label">Length</div>
                </div>
                <div class="unit-box" data-type="weight">
                    <div class="icon-wrapper"><div>⚖️</div></div>
                    <div class="label-text font-inter box-label">Weight</div>
                </div>
                <div class="unit-box" data-type="temperature">
                    <div class="icon-wrapper"><div>🌡️</div></div>
                    <div class="label-text font-inter box-label">Temperature</div>
                </div>
                <div class="unit-box" data-type="volume">
                    <div class="icon-wrapper"><div>🫙</div></div>
                    <div class="label-text font-inter box-label">Volume</div>
                </div>
            </div>
        </div>

        <div class="mode-section">
            <span class="label-text font-inter">CHOOSE ACTION</span>
            <div class="button-group">
                <button class="mode-btn">Comparison</button>
                <button class="mode-btn">Conversion</button>
                <button class="mode-btn">Arithmetic</button>
            </div>

            <div class="converter-panel">
                <div class="panel-header">
                    <span class="label-text font-inter">FROM</span>
                    <span class="label-text font-inter">TO</span>
                </div>

                <div class="panel-body">
                    <div class="input-block">
                        <input class="value-input font-inter" type="number" placeholder="0" id="input-from">
                        <div class="select-wrapper">
                            <select class="unit-select font-inter" id="select-from"></select>
                        </div>
                    </div>

                    <div class="input-block">
                        <input class="value-input font-inter" type="number" placeholder="0" id="input-to" readonly>
                        <div class="select-wrapper">
                            <select class="unit-select font-inter" id="select-to"></select>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/api.js"></script>
    <script type="module" src="js/conversion.js"></script>

</body>
</html>
